name: Check and publish
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: python3 scripts/check-public.py
      - run: python3 -m unittest discover -s tests -v
      - run: npm test
      - run: node --check static/app.js
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
        env:
          BASE44_APP_ID: ci-build
  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.BASE44_APP_ID != ''
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Configure app
        run: node scripts/ci-auth.mjs
        env:
          BASE44_APP_ID: ${{ vars.BASE44_APP_ID }}
          BASE44_DEPLOY_TOKEN: ${{ secrets.BASE44_DEPLOY_TOKEN }}
      - name: Build and deploy
        run: npx base44 deploy --build -y
        env:
          BASE44_DISABLE_TELEMETRY: '1'
      - name: Remove runner credentials
        if: always()
        run: node -e "require('fs').rmSync(require('path').join(require('os').homedir(),'.base44','auth'),{recursive:true,force:true})"
